apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-api
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels: { app: library-api }
  template:
    metadata:
      labels: { app: library-api }
    spec:
      containers:
        - name: api
          image: "{{ backend_image }}"
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: PORT, value: "3000" }
            - { name: ADMIN_EMAIL, value: admin@openshelf.local }
            - { name: PGHOST, value: postgres.library.svc.cluster.local }
            - { name: PGDATABASE, value: openshelf }
            - { name: PGUSER, value: openshelf }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: library-secrets, key: database-password } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: library-secrets, key: jwt-secret } } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 400m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: library-api
  namespace: library
spec:
  selector: { app: library-api }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
