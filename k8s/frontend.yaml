apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-web
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels: { app: library-web }
  template:
    metadata:
      labels: { app: library-web }
    spec:
      containers:
        - name: web
          image: "{{ frontend_image }}"
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 50m, memory: 48Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: library-web
  namespace: library
spec:
  type: NodePort
  selector: { app: library-web }
  ports:
    - { name: http, port: 80, targetPort: 8080, nodePort: 30080 }
